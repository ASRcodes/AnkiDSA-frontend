name: Client validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: npm ci
      - run: npm test
      - run: python3 scripts/check-secrets.py
      - name: Build validation web and extension
        run: |
          flutter build web --no-pub --no-wasm-dry-run --no-web-resources-cdn --pwa-strategy=none --dart-define=APP_ENV=production --dart-define=API_BASE_URL=https://api.validation.invalid
          python3 scripts/prepare-web.py --api https://api.validation.invalid --validation-only
          python3 scripts/package-extension.py --api https://api.validation.invalid --app https://app.validation.invalid --validation-only
      - name: Checkout companion API for browser integration
        uses: actions/checkout@v4
        with:
          repository: ASRcodes/AnkiDSA-Backend
          ref: ${{ vars.BACKEND_TEST_REF || 'main' }}
          path: backend
          persist-credentials: false
      - name: Build disposable API and test browser flows
        env:
          VALIDATION_API_PROXY: '1'
          ANKIDSA_BACKEND: ${{ github.workspace }}/backend
        run: |
          mvn -B -f backend/pom.xml package -DskipTests
          export JWT_SECRET="$(openssl rand -base64 48)"
          mkdir -p .work
          (cd backend && java -Xmx256m -jar target/ankidsa-backend-1.0.0.jar --spring.profiles.active=demo > ../.work/api.log 2>&1) &
          node scripts/serve-demo.cjs > .work/web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8081/ready >/dev/null; then break; fi
            sleep 3
          done
          curl --fail --silent http://localhost:8081/ready
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Compile Android debug and release with ephemeral CI key
        run: |
          flutter build apk --debug --no-pub
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/validation.p12"
          export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export ANDROID_KEY_ALIAS=validation
          keytool -genkeypair -keystore "$ANDROID_KEYSTORE_PATH" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD -alias validation -keyalg RSA -validity 2 -dname 'CN=CI Validation' -noprompt
          flutter build appbundle --release --no-pub --dart-define=APP_ENV=production --dart-define=API_BASE_URL=https://api.validation.invalid --dart-define=VALIDATION_ONLY=true
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: validation-web-extension
          path: |
            build/web
            build/extension/*.zip
          retention-days: 3
