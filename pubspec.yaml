name: ankidsa
description: Keep the patterns you learn. A spaced repetition companion for DSA.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
